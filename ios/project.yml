name: Board
options:
  bundleIdPrefix: com.josang0909
  deploymentTarget:
    iOS: "15.0"
targets:
  Board:
    type: application
    platform: iOS
    sources:
      - path: Board
    scheme: {}
    info:
      path: Board/Info.plist
      properties:
        # 애플 App ID 이름은 영문만 허용되어 기본값은 영문, 한글 이름은 ko.lproj에서 지정
        CFBundleDisplayName: FieldBoard
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        # 카메라 화면이 세로를 요구할 수 있어 앱 전체는 모두 허용하고, 보드판 화면만 가로로 고정
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: 현장 사진 촬영에 카메라를 사용합니다.
        NSPhotoLibraryUsageDescription: 저장된 사진을 불러올 때 사용합니다.
        NSPhotoLibraryAddUsageDescription: 촬영한 사진을 사진 앱에 저장합니다.
        NSLocationWhenInUseUsageDescription: 사진에 GPS 좌표를 표시합니다.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josang0909.fieldboard
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
